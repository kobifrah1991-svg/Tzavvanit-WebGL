# Builds the Tzivonit desktop apps (tzavvanit/desktop, Electron) for Windows and macOS.
#
# - Every push that touches the game or the desktop shell builds both apps and
#   keeps them as workflow artifacts.
# - Pushing a tag named desktop-v* (for example desktop-v1.0.0) also publishes a
#   draft GitHub Release with the installers, plus the Android APK from the
#   `downloads` branch when it is there.
#
# Signing is optional and switches on only when the secrets exist:
#   Windows: WIN_CSC_LINK (base64 .pfx) + WIN_CSC_KEY_PASSWORD
#   macOS:   MAC_CSC_LINK (base64 Developer ID Application .p12) + MAC_CSC_KEY_PASSWORD
#   Notarize: APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
# Without them the builds are unsigned, and the release notes say so.
name: Desktop build

on:
  push:
    branches: ['**']
    tags: ['desktop-v*']
    paths:
      - 'tzavvanit/www/**'
      - 'tzavvanit/desktop/**'
      - '.github/workflows/desktop-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tzavvanit/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tzavvanit/desktop/package-lock.json
      - run: npm ci
      - name: Build
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "::warning::No Windows code-signing certificate: building UNSIGNED"
            echo unsigned > dist-signing.txt
          else
            echo signed > dist-signing.txt
          fi
          npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            tzavvanit/desktop/dist/*.exe
            tzavvanit/desktop/dist-signing.txt

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: tzavvanit/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tzavvanit/desktop/package-lock.json
      - run: npm ci
      - name: Build
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "::warning::No Apple Developer ID certificate: building UNSIGNED and NOT notarized"
            echo unsigned > dist-signing.txt
            # Ad-hoc identity "-" keeps Apple Silicon able to launch the app.
            npx electron-builder --mac --universal --publish never -c.mac.identity=-
          else
            if [ -z "$APPLE_ID" ]; then
              echo "::warning::Signed with Developer ID but NOT notarized (APPLE_ID secrets missing)"
              echo signed-not-notarized > dist-signing.txt
            else
              echo signed-notarized > dist-signing.txt
            fi
            npx electron-builder --mac --universal --publish never
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            tzavvanit/desktop/dist/*.dmg
            tzavvanit/desktop/dist/*.zip
            tzavvanit/desktop/dist-signing.txt

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Android APK from the downloads branch (optional)
        run: |
          mkdir -p out/android
          curl -fsSL -o out/android/Tzivonit-1.0.apk \
            "https://raw.githubusercontent.com/${{ github.repository }}/downloads/tzivonit-1.0.apk" \
            || rm -f out/android/Tzivonit-1.0.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # upload-artifact keeps paths below the common folder, so files may sit in a dist/ subfolder
          WIN=$(cat $(find out/windows -name dist-signing.txt))
          MAC=$(cat $(find out/mac -name dist-signing.txt))
          FILES=$(find out -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.apk' \) ! -name '*uninstaller*')
          echo "$FILES"
          [ -n "$FILES" ] || { echo "::error::no build files found"; exit 1; }
          {
            echo "Tzivonit (צבעונית) desktop and Android builds."
            echo
            echo "- Windows: $WIN"
            echo "- macOS (universal, Intel + Apple Silicon): $MAC"
            if [ "$WIN" = unsigned ]; then
              echo
              echo "Windows SmartScreen may warn on first run: More info → Run anyway."
            fi
            if [ "$MAC" = unsigned ]; then
              echo
              echo "macOS: the app is not signed with a Developer ID or notarized. Right-click the app → Open, or allow it in System Settings → Privacy & Security."
            fi
          } > notes.md
          # Created as a draft: the owner reviews it and clicks Publish.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Tzivonit ${GITHUB_REF_NAME#desktop-v}" --notes-file notes.md \
            $FILES
